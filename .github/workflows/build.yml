name: Build VLESS Proxy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 打包 Linux x64
        run: npx pkg . --targets node20-linux-x64 --output release/vless-proxy-linux-x64

      - name: 打包 Linux arm64
        run: npx pkg . --targets node20-linux-arm64 --output release/vless-proxy-linux-arm64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vless-proxy-binaries
          path: release/*
          retention-days: 30
